name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Hermetic CI: the oracle corpus ref is pinned, never floating.
  # Bump this line deliberately with each corpus ride.
  CORPUS_REF: v0.3.41

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: wasm-pack build --target nodejs --out-dir pkg
      - run: node scripts/smoke-wasm.mjs
      # The wasm transport, gated by the oracle: every identity
      # fixture's molfile through the built module, byte-compared
      # against the recorded identifier / AuxInfo / InChIKey. The
      # engine's CI owns the full gate; this one covers the JS
      # boundary, which the smoke test alone cannot.
      - name: Clone the inchi-tests oracle corpus at $CORPUS_REF
        uses: actions/checkout@v7
        with:
          repository: chemomer/inchi-tests
          ref: ${{ env.CORPUS_REF }}
          path: .inchi-tests
      - run: node scripts/oracle_gate.mjs .inchi-tests
