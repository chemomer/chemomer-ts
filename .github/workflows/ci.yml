name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:debug
      - run: node scripts/smoke-napi.mjs
      # The release build proves the packaging configuration, not just
      # the dev build.
      - run: npm run build

  lint:
    # Clippy on the wrapper only — the engine arrives as a compiled
    # git dependency, its code is not linted here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
