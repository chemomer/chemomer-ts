# The npm publish path (the wasm build) — build, test, and the gated
# publish. Trusted publishing: package "chemomer" is registered with
# repository chemomer/chemomer-ts, workflow npm.yml, no environment.
# The parsanol pattern: registry-url STAYS (npm binds the OIDC publish
# to the configured registry host) and the token env is EXPLICITLY
# EMPTY so npm skips token auth and engages OIDC provenance instead.

name: npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after the build passes"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to publish (must match Cargo.toml; required when publish=true)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: wasm-pack build --release --target nodejs --out-dir pkg
      - run: node scripts/smoke-wasm.mjs

  publish:
    if: inputs.publish
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): the publish credential is the
      # job's OIDC token — no stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version matches input
        run: |
          actual=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: input=${{ inputs.version }}, Cargo.toml=$actual"
            exit 1
          fi
          echo "Publishing $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # The parsanol pattern: the registry host must be configured
          # for the OIDC publish to bind to it.
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: wasm-pack build --release --target nodejs --out-dir pkg
      - name: Publish with provenance
        run: |
          cd pkg
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
