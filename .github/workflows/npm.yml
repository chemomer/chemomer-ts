# The npm publish path (the napi binding moved here from the engine
# repo) — build, test, and the gated multi-platform publish.
#
# Dispatch-only: nothing runs on push or PR. A bare dispatch builds and
# smoke-tests the four platform binaries. Publishing is doubly gated —
# an explicit `publish` dispatch input AND the npm trusted-publisher
# registrations (until they exist, the publish step fails at the
# registry with no upload).
#
# TRUSTED PUBLISHING — five registrations required, each with
# repository chemomer/chemomer-ts, workflow npm.yml, NO environment:
#
#   chemomer                  main package   (registered; proven green)
#   chemomer-darwin-arm64     platform package
#   chemomer-darwin-x64       platform package
#   chemomer-linux-x64-gnu    platform package
#   chemomer-win32-x64-msvc   platform package
#
# The publish job below intentionally declares NO `environment:` key —
# the OIDC claims must match the registrations exactly. Platform
# packages publish FIRST, the main package LAST: its
# optionalDependencies pin the platform packages at the same version.

name: npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after the build+test matrix passes"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to publish (must match package.json; required when publish=true)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ubuntu-latest
            binary: index.linux-x64-gnu.node
          - os: macos-latest
            binary: index.darwin-arm64.node
          # macos-13 is retired: darwin-x64 cross-compiles on the arm64
          # runner (Apple's toolchain links across arches natively), so
          # this leg proves the build and the artifact name; the binary
          # itself cannot execute here.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: index.darwin-x64.node
            cross: true
          - os: windows-latest
            binary: index.win32-x64-msvc.node
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - run: npm ci
      - run: npm run build:debug
      - run: node scripts/smoke-napi.mjs
        if: ${{ !matrix.settings.cross }}
      # The release build proves the packaging configuration, not just
      # the dev build. The cross leg builds its target triple directly
      # (the artifact the publish flow stages).
      - run: npm run build
        if: ${{ !matrix.settings.cross }}
      - run: npx napi build --platform --release --js false --target ${{ matrix.settings.target }}
        if: ${{ matrix.settings.cross }}
      - name: Verify the per-platform binary name
        shell: bash
        run: test -f "${{ matrix.settings.binary }}" || { ls -la; exit 1; }
      - name: Stage the release binary for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.binary }}
          path: ${{ matrix.settings.binary }}
          if-no-files-found: error

  publish:
    # Platform packages first, main package last — the main package's
    # optionalDependencies point at the platform packages.
    if: inputs.publish
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): the publish credential is the
      # job's OIDC token — no stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version matches input
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: input=${{ inputs.version }}, package.json=$actual"
            exit 1
          fi
          echo "Publishing $actual"
      # The parsanol pattern: registry-url STAYS (npm binds the OIDC
      # publish to the configured registry host) with the token env
      # EXPLICITLY EMPTY — the empty ${NODE_AUTH_TOKEN} in .npmrc makes
      # npm skip token auth and engage OIDC provenance instead.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Regenerate the universal loader (index.js/index.d.ts are build
      # outputs, not committed).
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npm run create-npm-dirs
      # Moves each downloaded binary into npm/<triple>/ (and the tree
      # root) by its index.<platform>.node name.
      - run: npm run artifacts
      - name: Verify every platform package carries its binary
        run: |
          for dir in darwin-arm64 darwin-x64 linux-x64-gnu win32-x64-msvc; do
            test -f "npm/${dir}/index.${dir}.node" || { echo "missing binary: npm/${dir}"; ls -R npm artifacts; exit 1; }
          done
      - name: Prove the optionalDependencies resolution (linux platform package)
        run: |
          npm install --no-save ./npm/linux-x64-gnu
          node scripts/smoke-napi.mjs --layout
      - name: Publish the platform packages
        run: |
          npm publish --access public --provenance npm/darwin-arm64
          npm publish --access public --provenance npm/darwin-x64
          npm publish --access public --provenance npm/linux-x64-gnu
          npm publish --access public --provenance npm/win32-x64-msvc
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
      - name: Publish the main package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
