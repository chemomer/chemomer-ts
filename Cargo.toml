[package]
name = "chemomer"
version = "1.0.2"
edition = "2021"
description = "The chemomer engine compiled to WebAssembly — molfile in, identifier / AuxInfo / InChIKey out"
license = "MIT"
repository = "https://github.com/chemomer/chemomer-ts"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The engine, by its crate name, renamed: this crate is the `chemomer`
# wasm module, so the engine lands as `chemomer_engine` here.
chemomer_engine = { package = "chemomer", git = "https://github.com/chemomer/chemomer" }
wasm-bindgen = "0.2"

# wasm-pack's wasm-opt needs a binaryen download that fails in CI
# (the pinned release URL is dead) — the optimization pass is not
# load-bearing for this module.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
